summary: Retrieve Supplementary Document Information
description: |
  This endpoint allows a developer to retrieve a list of supporting documents uploaded for a specified individual for a given tax year. A National Insurance number and tax year are required.
  
  ###  Test data
  Scenario simulation using Gov-Test-Scenario headers is only available in the sandbox environment.
  
  | Header Value (Gov-Test-Scenario) | Scenario                                                         |
  |----------------------------------|------------------------------------------------------------------|
  | N/A - DEFAULT                    | Simulates success response.                                      |
  | NOT_FOUND                        | Simulates the scenario where no data is found.                   |
  | STATEFUL                         | Performs a stateful retrieve.                                    |

tags:
  - Supplementary Document Upload

parameters:
  - $ref: './common/pathParameters.yaml#/components/parameters/nino'
  - $ref: './common/pathParameters.yaml#/components/parameters/taxYear'
  - name: documentId
    in: query
    description: The unique document identifier.
    required: false
    schema:
      type: string
      format: uuid
      example: 11370e18-6e24-453e-b45a-76d3e32ea33d
  - name: selected
    in: query
    description: The uploaded document status. True means that it is to be included in the tax return.
    required: false
    schema:
      type: boolean
      example: true
  - name: status
    in: query
    description: |
      The document's processing status. You can filter documents by supplying multiple status options, for example `?status=requested&status=success`.
    required: false
    style: form
    explode: true
    schema:
      type: array
      items:
        type: string
        enum:
          - requested
          - success
          - failed
  - $ref: './common/headers.yaml#/components/parameters/acceptHeader'
  - $ref: './common/headers.yaml#/components/parameters/authorizationReadScopeHeader'
  - $ref: './common/headers.yaml#/components/parameters/testScenarioHeader'

security:
  - User-Restricted:
    - read:self-assessment

responses:
  "200":
    description: Success
    headers:
      X-CorrelationId:
        $ref: './common/headers.yaml#/components/parameters/correlationId'
      Deprecation:
        $ref: './common/headers.yaml#/components/parameters/deprecationHeader'
      Sunset:
        $ref: './common/headers.yaml#/components/parameters/sunsetHeader'
      Link:
        $ref: './common/headers.yaml#/components/parameters/linkHeader'
    content:
      application/json:
        schema:
          $ref: './schemas/supplementaryInformation/retrieveDocuments/response.json'
        example:
          $ref: './examples/supplementaryInformation/retrieveDocuments/response.json'

  "400":
    description: Bad request
    headers:
      X-CorrelationId:
        $ref: './common/headers.yaml#/components/parameters/correlationId'
      Deprecation:
        $ref: './common/headers.yaml#/components/parameters/deprecationHeader'
      Sunset:
        $ref: './common/headers.yaml#/components/parameters/sunsetHeader'
      Link:
        $ref: './common/headers.yaml#/components/parameters/linkHeader'
    content:
      application/json:
        schema:
          $ref: './schemas/error_response.yaml'
        examples:
          FORMAT_NINO:
            $ref: './common/errors.yaml#/components/examples/formatNino'
          FORMAT_TAX_YEAR:
            $ref: './common/errors.yaml#/components/examples/formatTaxYear'
          FORMAT_DOCUMENT_ID:
            $ref: './common/errors.yaml#/components/examples/formatDocumentId'
          FORMAT_SELECTED:
            $ref: './common/errors.yaml#/components/examples/formatSelected'
          FORMAT_STATUS:
            $ref: './common/errors.yaml#/components/examples/formatStatus'
          RULE_TAX_YEAR_NOT_SUPPORTED:
            $ref: './common/errors.yaml#/components/examples/ruleTaxYearNotSupported'
          RULE_TAX_YEAR_RANGE_INVALID:
            $ref: './common/errors.yaml#/components/examples/ruleTaxYearRangeInvalid'
          RULE_INCORRECT_GOV_TEST_SCENARIO:
            $ref: './common/errors.yaml#/components/examples/ruleIncorrectGovTestScenario'

  "403":
    description: Forbidden
    headers:
      X-CorrelationId:
        $ref: './common/headers.yaml#/components/parameters/correlationId'
      Deprecation:
        $ref: './common/headers.yaml#/components/parameters/deprecationHeader'
      Sunset:
        $ref: './common/headers.yaml#/components/parameters/sunsetHeader'
      Link:
        $ref: './common/headers.yaml#/components/parameters/linkHeader'
    content:
      application/json:
        schema:
          $ref: './schemas/error_response.yaml'
        examples:
          CLIENT_OR_AGENT_NOT_AUTHORISED:
            $ref: './common/errors.yaml#/components/examples/clientOrAgentNotAuthorised'

  "404":
    description: Not Found
    headers:
      X-CorrelationId:
        $ref: './common/headers.yaml#/components/parameters/correlationId'
      Deprecation:
        $ref: './common/headers.yaml#/components/parameters/deprecationHeader'
      Sunset:
        $ref: './common/headers.yaml#/components/parameters/sunsetHeader'
      Link:
        $ref: './common/headers.yaml#/components/parameters/linkHeader'
    content:
      application/json:
        schema:
          $ref: './schemas/error_response.yaml'
        examples:
          MATCHING_RESOURCE_NOT_FOUND:
            description: The supplied income source could not be found.
            value:
              code: MATCHING_RESOURCE_NOT_FOUND
              message: Matching resource not found
